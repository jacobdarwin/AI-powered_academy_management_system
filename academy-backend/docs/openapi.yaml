openapi: 3.0.3
info:
  title: Academy Management API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /health:
    get:
      responses:
        "200":
          description: Health status
  /auth/login:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, userId, password]
              properties:
                role: {type: string}
                userId: {type: string}
                password: {type: string, format: password}
      responses:
        "200": {description: Login successful}
        "401": {description: Invalid credentials}
  /auth/me:
    get:
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Current user}
  /courses:
    get:
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Course list}
    post:
      security: [{bearerAuth: []}]
      responses:
        "201": {description: Course created}
  /students:
    get:
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Student list}
  /leads:
    get:
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Lead list}
    post:
      security: [{bearerAuth: []}]
      responses:
        "201": {description: Lead created}
  /fees/payments:
    post:
      security: [{bearerAuth: []}]
      responses:
        "201": {description: Payment recorded}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
