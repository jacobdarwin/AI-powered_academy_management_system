<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="../assets/admin.css" rel="stylesheet">
  <link href="../assets/student.css" rel="stylesheet"><title>Dashboard | Student</title></head>
<body><aside class="sidebar" id="sidebar"></aside><div class="backdrop" id="backdrop"></div>
<div class="main"><header class="topbar" id="topbar"></header><main class="content">
  <div class="panel mb-3"><div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
    <div><h2 class="h4 fw-bold mb-1" id="hello"></h2><div class="text-secondary" id="course"></div></div>
    <div style="min-width:240px;flex:1;max-width:360px"><div class="d-flex justify-content-between small fw-semibold mb-1"><span>Course progress</span><span id="progTxt"></span></div>
    <div class="progress" role="progressbar" aria-label="Course progress" id="prog" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar" id="progBar"></div></div></div></div></div>
  <div class="row g-3 mb-3" id="stats"></div>
  <div class="row g-3 mb-3">
    <div class="col-xl-7"><div class="panel h-100"><h2>Today's classes</h2><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Time</th><th>Topic</th><th>Trainer</th><th>Room</th></tr></thead><tbody id="classes"></tbody></table></div></div></div>
    <div class="col-xl-5"><div class="panel h-100"><h2>Deadlines</h2><div id="deadlines"></div></div></div>
  </div>
  <div class="row g-3">
    <div class="col-xl-7"><div class="panel h-100"><h2>Placement drives open for you</h2><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Company</th><th>Role</th><th>Date</th><th>Package</th><th></th></tr></thead><tbody id="drives"></tbody></table></div></div></div>
    <div class="col-xl-5"><div class="panel h-100"><h2>Announcements</h2><div id="news"></div></div></div>
  </div>
</main></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="toast" class="toast text-bg-success" role="status"><div class="toast-body" id="toastMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script><script src="../assets/student.js"></script>
<script src="../assets/js/student/dashboard.js"></script></body></html>
