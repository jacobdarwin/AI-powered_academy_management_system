<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="../assets/admin.css" rel="stylesheet">
  <link href="../assets/student.css" rel="stylesheet"><title>Placement readiness | Student</title></head>
<body><aside class="sidebar" id="sidebar"></aside><div class="backdrop" id="backdrop"></div>
<div class="main"><header class="topbar" id="topbar"></header><main class="content">
  <div class="row g-3">
    <div class="col-xl-4"><div class="panel text-center h-100"><div class="d-flex justify-content-center mb-3"><div class="gauge" id="gauge"><div class="in"><div><div class="display-6 fw-bold" id="gScore"></div><div class="small text-secondary">out of 100</div></div></div></div></div>
      <div id="gCat" class="mb-2"></div><p class="text-secondary small mb-3" id="gText"></p><button class="btn btn-brand" id="mock"><i class="bi bi-mic me-1"></i>Book a mock interview</button></div></div>
    <div class="col-xl-8"><div class="panel mb-3"><h2>Your score breakdown</h2><div id="factors"></div></div>
      <div class="panel"><h2>What to improve first</h2><div id="tips"></div></div></div></div>
  <p class="small text-secondary mt-3">This score is estimated from your marks, attendance, assignments, mock interviews and projects. It guides your preparation. It does not decide whether a company selects you.</p>
</main></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="toast" class="toast text-bg-success" role="status"><div class="toast-body" id="toastMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script><script src="../assets/student.js"></script>
<script src="../assets/js/student/readiness.js"></script></body></html>
