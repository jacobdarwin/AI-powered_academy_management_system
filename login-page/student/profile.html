<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="../assets/admin.css" rel="stylesheet">
  <link href="../assets/student.css" rel="stylesheet"><title>My profile | Student</title></head>
<body><aside class="sidebar" id="sidebar"></aside><div class="backdrop" id="backdrop"></div>
<div class="main"><header class="topbar" id="topbar"></header><main class="content">
  <div class="row g-3">
    <div class="col-xl-4"><div class="panel text-center h-100">
      <div id="photoBox" class="mx-auto mb-3 d-grid" style="width:110px;height:110px;border-radius:50%;background:var(--amber);color:var(--ink);font-size:2rem;font-weight:800;place-items:center;overflow:hidden"></div>
      <h2 class="h5 fw-bold mb-0" id="pName"></h2><div class="text-secondary small mb-3" id="pId"></div>
      <label class="btn btn-sm btn-outline-secondary">Change photo<input id="photo" type="file" accept="image/*" hidden></label>
      <dl class="text-start mt-4 mb-0 small" id="fixed"></dl></div></div>
    <div class="col-xl-8">
      <form class="panel mb-3" id="f1" novalidate><h2>Contact details</h2><div class="row g-3">
        <div class="col-md-6"><label class="form-label fw-semibold" for="phone">Phone</label><input id="phone" class="form-control" pattern="[0-9]{10}" inputmode="numeric" required><div class="invalid-feedback">Enter a 10-digit phone number.</div></div>
        <div class="col-md-6"><label class="form-label fw-semibold" for="email">Email</label><input id="email" type="email" class="form-control" required><div class="invalid-feedback">Enter a valid email.</div></div>
        <div class="col-md-6"><label class="form-label fw-semibold" for="parent">Parent or guardian phone</label><input id="parent" class="form-control" pattern="[0-9]{10}" inputmode="numeric"><div class="invalid-feedback">Enter a 10-digit phone number.</div></div>
        <div class="col-12"><label class="form-label fw-semibold" for="addr">Address</label><textarea id="addr" rows="2" class="form-control"></textarea></div>
        <div class="col-12"><button class="btn btn-brand">Save changes</button></div></div></form>
      <form class="panel" id="f2" novalidate><h2>Change password</h2><div class="row g-3">
        <div class="col-12"><label class="form-label fw-semibold" for="p0">Current password</label><input id="p0" type="password" class="form-control" autocomplete="current-password" required></div>
        <div class="col-md-6"><label class="form-label fw-semibold" for="p1">New password</label><input id="p1" type="password" minlength="8" class="form-control" autocomplete="new-password" required><div class="invalid-feedback">Use at least 8 characters.</div></div>
        <div class="col-md-6"><label class="form-label fw-semibold" for="p2">Confirm new password</label><input id="p2" type="password" class="form-control" autocomplete="new-password" required><div class="invalid-feedback">The passwords do not match.</div></div>
        <div class="col-12"><button class="btn btn-brand">Update password</button></div></div></form>
    </div></div>
</main></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="toast" class="toast text-bg-success" role="status"><div class="toast-body" id="toastMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script><script src="../assets/student.js"></script>
<script src="../assets/js/student/profile.js"></script></body></html>
