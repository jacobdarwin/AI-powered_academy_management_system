<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="../assets/admin.css" rel="stylesheet">
  <link href="../assets/student.css" rel="stylesheet"><title>Attendance | Student</title></head>
<body><aside class="sidebar" id="sidebar"></aside><div class="backdrop" id="backdrop"></div>
<div class="main"><header class="topbar" id="topbar"></header><main class="content">
  <div class="row g-3 mb-3" id="stats"></div>
  <div id="warn" class="alert alert-warning d-none">Your attendance is below 75%. Talk to your trainer to avoid missing placement drives.</div>
  <div class="panel"><div class="d-flex justify-content-between align-items-center mb-3">
    <button class="btn btn-outline-secondary btn-sm" id="prev" aria-label="Previous month"><i class="bi bi-chevron-left"></i></button>
    <h2 class="mb-0" id="mTitle"></h2><button class="btn btn-outline-secondary btn-sm" id="next" aria-label="Next month"><i class="bi bi-chevron-right"></i></button></div>
    <div class="cal" id="cal"></div>
    <div class="small mt-3"><span class="lg" style="background:#dff3e8"></span>Present <span class="lg ms-3" style="background:#f8dedb"></span>Absent <span class="lg ms-3" style="background:#fbeccd"></span>Late <span class="lg ms-3" style="background:#e8edf3"></span>No class</div></div>
</main></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="toast" class="toast text-bg-success" role="status"><div class="toast-body" id="toastMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script><script src="../assets/student.js"></script>
<script src="../assets/js/student/attendance.js"></script></body></html>
