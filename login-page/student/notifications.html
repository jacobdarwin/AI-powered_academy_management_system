<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="../assets/admin.css" rel="stylesheet">
  <link href="../assets/student.css" rel="stylesheet"><title>Notifications | Student</title></head>
<body data-role="student"><aside class="sidebar" id="sidebar"></aside><div class="backdrop" id="backdrop"></div>
<div class="main"><header class="topbar" id="topbar"></header><main class="content">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div><h2 class="h4 fw-bold mb-0">Notifications</h2><div class="text-secondary small" id="sub"></div></div>
    <div class="d-flex gap-2"><div class="btn-group" role="group" aria-label="Filter"><input type="radio" class="btn-check" name="flt" id="fAll" checked><label class="btn btn-outline-secondary" for="fAll">All</label>
    <input type="radio" class="btn-check" name="flt" id="fUnread"><label class="btn btn-outline-secondary" for="fUnread">Unread</label></div>
    <button class="btn btn-brand" id="markAll"><i class="bi bi-check2-all me-1"></i>Mark all as read</button></div></div>
  <div class="panel p-0" id="list"></div>
</main></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="toast" class="toast text-bg-success" role="status"><div class="toast-body" id="toastMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script><script src="../assets/student.js"></script>
<script src="../assets/js/notifications.js"></script></body></html>
