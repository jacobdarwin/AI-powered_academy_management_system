<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="../assets/admin.css" rel="stylesheet">
  <link href="../assets/student.css" rel="stylesheet"><title>Marks and assignments | Student</title></head>
<body><aside class="sidebar" id="sidebar"></aside><div class="backdrop" id="backdrop"></div>
<div class="main"><header class="topbar" id="topbar"></header><main class="content">
  <div class="row g-3 mb-3" id="stats"></div>
  <ul class="nav nav-pills mb-3" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tTests" type="button" role="tab">Test results</button></li>

    <div class="tab-pane fade show active" id="tTests"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Test</th><th>Date</th><th>Score</th><th style="min-width:140px">Percentage</th><th>Class average</th></tr></thead><tbody id="tests"></tbody></table></div></div>
    <div class="tab-pane fade" id="tAsg"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Assignment</th><th>Due date</th><th>Status</th><th></th></tr></thead><tbody id="asg"></tbody></table></div></div>
  </div></div>
</main></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="toast" class="toast text-bg-success" role="status"><div class="toast-body" id="toastMsg"></div></div></div>
