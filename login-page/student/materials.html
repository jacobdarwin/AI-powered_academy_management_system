<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="../assets/admin.css" rel="stylesheet">
  <link href="../assets/student.css" rel="stylesheet"><title>Study materials | Student</title></head>
<body><aside class="sidebar" id="sidebar"></aside><div class="backdrop" id="backdrop"></div>
<div class="main"><header class="topbar" id="topbar"></header><main class="content">
  <div class="mb-3"><h2 class="h4 fw-bold mb-0">Study materials</h2><div class="text-secondary small">Notes, videos and practice files shared by your trainers.</div></div>
  <div class="panel mb-3"><div class="row g-2"><div class="col-md-8"><div class="input-group"><span class="input-group-text bg-white"><i class="bi bi-search"></i></span><input id="q" class="form-control" placeholder="Search by topic" aria-label="Search materials"></div></div>
  <div class="col-md-4"><select id="type" class="form-select" aria-label="Filter by type"><option value="">All types</option><option>Notes</option><option>Video</option><option>Practice</option></select></div></div></div>
  <div class="row g-3" id="list"></div><div id="empty" class="text-center text-secondary py-4 d-none">No materials match. Clear the search or the type filter.</div>
</main></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="toast" class="toast text-bg-success" role="status"><div class="toast-body" id="toastMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script><script src="../assets/student.js"></script>
<script src="../assets/js/student/materials.js"></script></body></html>
