<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="../assets/admin.css" rel="stylesheet">
  <link href="../assets/student.css" rel="stylesheet"><title>AI assistant | Student</title></head>
<body><aside class="sidebar" id="sidebar"></aside><div class="backdrop" id="backdrop"></div>
<div class="main"><header class="topbar" id="topbar"></header><main class="content">
  <div class="panel chat"><div class="d-flex align-items-center gap-2 border-bottom pb-3 mb-2"><span class="brand-mark" style="background:var(--teal);color:#fff"><i class="bi bi-stars"></i></span>
    <div><div class="fw-bold">Academy AI assistant</div><div class="small text-secondary">Answers from your academy records. For anything important, confirm with the office.</div></div></div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="d-flex flex-wrap gap-2 py-2" id="chips"></div>
    <form class="d-flex gap-2" id="form"><label class="visually-hidden" for="input">Ask a question</label><input id="input" class="form-control" placeholder="Ask about your attendance, fees, classes, marks..." autocomplete="off" required>
    <button class="btn btn-brand" aria-label="Send"><i class="bi bi-send-fill"></i></button></form></div>
</main></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="toast" class="toast text-bg-success" role="status"><div class="toast-body" id="toastMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script><script src="../assets/student.js"></script>
<script src="../assets/js/student/assistant.js"></script></body></html>
