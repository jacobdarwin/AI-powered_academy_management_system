<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set new password | Academy Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body><main class="min-vh-100 d-flex align-items-center justify-content-center p-4">
  <div class="login-box w-100">
    <h1 class="h3 fw-bold">Set a new password</h1>
    <p class="text-secondary">Choose a new password for your account.</p>
    <div id="alert" class="alert d-none" role="alert"></div>
    <form id="resetForm" novalidate>
      <label class="form-label fw-semibold" for="password">New password</label>
      <input id="password" class="form-control mb-3" type="password" minlength="8" required>
      <label class="form-label fw-semibold" for="confirm">Confirm password</label>
      <input id="confirm" class="form-control mb-3" type="password" minlength="8" required>
      <button class="btn btn-brand w-100" type="submit">Update password</button>
    </form>
  </div>
</main>
<script src="assets/js/api.js"></script>
<script>
document.getElementById("resetForm").addEventListener("submit", async event => {
  event.preventDefault();
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;
  const alert = document.getElementById("alert");
  if (password.length < 8 || password !== confirm) {
    alert.textContent = password !== confirm ? "Passwords do not match." : "Use at least 8 characters.";
    alert.className = "alert alert-danger"; return;
  }
  try {
    const token = new URLSearchParams(location.search).get("token");
    await api.post("/auth/reset-password", {token, password});
    alert.textContent = "Password updated. You can sign in now.";
    alert.className = "alert alert-success";
  } catch (error) {
    alert.textContent = error.message; alert.className = "alert alert-danger";
  }
});
</script></body></html>
