<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Students | Staff</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="../assets/admin.css" rel="stylesheet">
  <link href="../assets/superadmin.css" rel="stylesheet">
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="backdrop" id="backdrop"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div><h2 class="h4 fw-bold mb-0">Students</h2><div class="text-secondary small" id="count"></div></div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary" id="exportBtn"><i class="bi bi-download me-1"></i>Export CSV</button>
          <button class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#addModal"><i class="bi bi-plus-lg me-1"></i>Add student</button>
        </div>
      </div>

      <div class="panel mb-3">
        <div class="row g-2">
          <div class="col-md-5"><div class="input-group"><span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
            <input id="q" class="form-control" placeholder="Search by name, ID or phone" aria-label="Search students"></div></div>
          <div class="col-6 col-md-3"><select id="fCourse" class="form-select" aria-label="Filter by course"><option value="">All courses</option></select></div>
          <div class="col-6 col-md-2"><select id="fStatus" class="form-select" aria-label="Filter by status"><option value="">All status</option><option>Active</option><option>Completed</option><option>Dropped</option></select></div>
          <div class="col-md-2"><select id="fFees" class="form-select" aria-label="Filter by fees"><option value="">All fees</option><option>Paid</option><option>Part paid</option><option>Pending</option></select></div>
        </div>
      </div>

      <div class="panel">
        <div class="table-responsive">
          <table class="table align-middle table-hover">
            <thead><tr><th>Student</th><th>Course and batch</th><th>Phone</th><th style="min-width:120px">Attendance</th><th>Fees</th><th>Status</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div id="empty" class="text-center text-secondary py-4 d-none">No students match these filters. Clear a filter or add a new student.</div>
      </div>
    </main>
  </div>

  <!-- Add student -->
  <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable"><form class="modal-content" id="addForm" novalidate>
      <div class="modal-header"><h2 class="modal-title h5 fw-bold" id="addTitle">Add student</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body"><div class="row g-3">
        <div class="col-md-6"><label class="form-label fw-semibold" for="fName">Full name</label><input id="fName" class="form-control" required><div class="invalid-feedback">Enter the student's name.</div></div>
        <div class="col-md-6"><label class="form-label fw-semibold" for="fPhone">Phone</label><input id="fPhone" class="form-control" pattern="[0-9]{10}" inputmode="numeric" required><div class="invalid-feedback">Enter a 10-digit phone number.</div></div>
        <div class="col-md-6"><label class="form-label fw-semibold" for="fEmail">Email</label><input id="fEmail" type="email" class="form-control" required><div class="invalid-feedback">Enter a valid email.</div></div>
        <div class="col-md-6"><label class="form-label fw-semibold" for="fDob">Date of birth</label><input id="fDob" type="date" class="form-control" required><div class="invalid-feedback">Select the date of birth.</div></div>
        <div class="col-md-6"><label class="form-label fw-semibold" for="fCourseAdd">Course</label><select id="fCourseAdd" class="form-select" required></select></div>
        <div class="col-md-6"><label class="form-label fw-semibold" for="fBatch">Batch</label><select id="fBatch" class="form-select" required></select></div>
        <div class="col-md-6"><label class="form-label fw-semibold" for="fPaid">Fee paid now (â‚¹)</label><input id="fPaid" type="number" min="0" class="form-control" value="0"></div>
        <div class="col-md-6"><label class="form-label fw-semibold" for="fParent">Parent or guardian phone</label><input id="fParent" class="form-control" pattern="[0-9]{10}" inputmode="numeric"><div class="invalid-feedback">Enter a 10-digit phone number.</div></div>
        <div class="col-12"><label class="form-label fw-semibold" for="fAddr">Address</label><textarea id="fAddr" rows="2" class="form-control"></textarea></div>
      </div></div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-brand">Save student</button></div>
    </form></div>
  </div>

  <!-- Profile -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="profile" aria-labelledby="pName" style="width:400px">
    <div class="offcanvas-header"><h2 class="offcanvas-title h5 fw-bold" id="pName"></h2><button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button></div>
    <div class="offcanvas-body" id="pBody"></div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="toast" class="toast text-bg-success" role="status"><div class="toast-body" id="toastMsg"></div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/staff.js"></script>
  <script src="../assets/js/superadmin/students.js"></script>
</body>
</html>
