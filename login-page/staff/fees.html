<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="../assets/admin.css" rel="stylesheet">
  <link href="../assets/superadmin.css" rel="stylesheet"><title>Fees & Accounts | Staff</title></head>
<body>
<aside class="sidebar" id="sidebar"></aside><div class="backdrop" id="backdrop"></div>
<div class="main"><header class="topbar" id="topbar"></header>
<main class="content">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div><h2 class="h4 fw-bold mb-0">Fees and accounts</h2><div class="text-secondary small">Payments, pending dues and expenses.</div></div>
    <div class="d-flex gap-2"><button class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#expModal"><i class="bi bi-plus-lg me-1"></i>Add expense</button>
    <button class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#payModal"><i class="bi bi-receipt me-1"></i>Collect fee</button></div>
  </div>
  <div class="row g-3 mb-3" id="stats"></div>
  <ul class="nav nav-pills mb-3" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tPay" type="button" role="tab">Payments</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tDue" type="button" role="tab">Pending dues</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tExp" type="button" role="tab">Expenses</button></li>
  </ul>
  <div class="tab-content"><div class="panel">
    <div class="tab-pane fade show active" id="tPay"><div class="table-responsive"><table class="table align-middle table-hover"><thead><tr><th>Receipt</th><th>Student</th><th>Date</th><th>Mode</th><th>Amount</th><th></th></tr></thead><tbody id="payRows"></tbody></table></div></div>
    <div class="tab-pane fade" id="tDue"><div class="table-responsive"><table class="table align-middle table-hover"><thead><tr><th>Student</th><th>Course</th><th>Total</th><th>Paid</th><th>Balance</th><th>Due date</th><th></th></tr></thead><tbody id="dueRows"></tbody></table></div><div id="noDue" class="text-center text-secondary py-4 d-none">No pending dues. Every student is paid up.</div></div>
    <div class="tab-pane fade" id="tExp"><div class="table-responsive"><table class="table align-middle table-hover"><thead><tr><th>Date</th><th>Category</th><th>Note</th><th>Amount</th></tr></thead><tbody id="expRows"></tbody></table></div></div>
  </div></div>
</main></div>

<div class="modal fade" id="payModal" tabindex="-1" aria-labelledby="pT" aria-hidden="true"><div class="modal-dialog"><form class="modal-content" id="payForm" novalidate>
  <div class="modal-header"><h2 class="modal-title h5 fw-bold" id="pT">Collect fee</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body row g-3">
    <div class="col-12"><label class="form-label fw-semibold" for="pStu">Student</label><select id="pStu" class="form-select"></select><div class="small text-secondary mt-1" id="pBal"></div></div>
    <div class="col-6"><label class="form-label fw-semibold" for="pAmt">Amount (â‚¹)</label><input id="pAmt" type="number" min="1" class="form-control" required><div class="invalid-feedback">Enter an amount within the balance.</div></div>
    <div class="col-6"><label class="form-label fw-semibold" for="pMode">Payment mode</label><select id="pMode" class="form-select"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank transfer</option></select></div>
  </div>
  <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-brand">Save and generate receipt</button></div></form></div></div>

<div class="modal fade" id="expModal" tabindex="-1" aria-labelledby="eT" aria-hidden="true"><div class="modal-dialog"><form class="modal-content" id="expForm" novalidate>
  <div class="modal-header"><h2 class="modal-title h5 fw-bold" id="eT">Add expense</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body row g-3">
    <div class="col-6"><label class="form-label fw-semibold" for="eCat">Category</label><select id="eCat" class="form-select"><option>Rent</option><option>Trainer payroll</option><option>Electricity and internet</option><option>Marketing</option><option>Other</option></select></div>
    <div class="col-6"><label class="form-label fw-semibold" for="eAmt">Amount (â‚¹)</label><input id="eAmt" type="number" min="1" class="form-control" required><div class="invalid-feedback">Enter the amount.</div></div>
    <div class="col-12"><label class="form-label fw-semibold" for="eNote">Note</label><input id="eNote" class="form-control"></div>
  </div>
  <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-brand">Save expense</button></div></form></div></div>

<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="toast" class="toast text-bg-success" role="status"><div class="toast-body" id="toastMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script><script src="../assets/staff.js"></script>
<script src="../assets/js/superadmin/fees.js"></script></body></html>
