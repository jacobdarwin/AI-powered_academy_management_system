<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="../assets/admin.css" rel="stylesheet">
  <link href="../assets/superadmin.css" rel="stylesheet"><title>Attendance | Staff</title></head>
<body>
<aside class="sidebar" id="sidebar"></aside><div class="backdrop" id="backdrop"></div>
<div class="main"><header class="topbar" id="topbar"></header>
<main class="content">
  <div class="mb-3"><h2 class="h4 fw-bold mb-0">Attendance</h2><div class="text-secondary small">Mark a batch for a day and spot students who are falling behind.</div></div>
  <div class="panel mb-3"><div class="row g-2 align-items-end">
    <div class="col-md-4"><label class="form-label fw-semibold" for="batch">Batch</label><select id="batch" class="form-select"></select></div>
    <div class="col-md-3"><label class="form-label fw-semibold" for="date">Date</label><input id="date" type="date" class="form-control"></div>
    <div class="col-md-5 d-flex gap-2 flex-wrap"><button class="btn btn-outline-secondary" id="allP">Mark all present</button><button class="btn btn-brand" id="save"><i class="bi bi-check2 me-1"></i>Save attendance</button></div>
  </div></div>
  <div class="row g-3 mb-3" id="sum"></div>
  <div class="row g-3">
    <div class="col-xl-8"><div class="panel h-100"><h2>Students</h2><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Student</th><th>Overall</th><th>Today</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
    <div class="col-xl-4"><div class="panel h-100"><h2>Below 75% attendance</h2><div id="low"></div></div></div>
  </div>
</main></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="toast" class="toast text-bg-success" role="status"><div class="toast-body" id="toastMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script><script src="../assets/staff.js"></script>
<script src="../assets/js/superadmin/attendance.js"></script></body></html>
