<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="../assets/admin.css" rel="stylesheet">
  <link href="../assets/superadmin.css" rel="stylesheet"><title>Test marks | Staff</title></head>
<body><aside class="sidebar" id="sidebar"></aside><div class="backdrop" id="backdrop"></div>
<div class="main"><header class="topbar" id="topbar"></header><main class="content">
  <div class="mb-3"><h2 class="h4 fw-bold mb-0">Test marks</h2><div class="text-secondary small">Enter marks for a batch. Students see them on their Marks page.</div></div>
  <div class="panel mb-3"><div class="row g-2 align-items-end">
    <div class="col-md-3"><label class="form-label fw-semibold" for="batch">Batch</label><select id="batch" class="form-select"></select></div>
    <div class="col-md-4"><label class="form-label fw-semibold" for="test">Test name</label><input id="test" class="form-control" value="Unit test 3: Python OOP"></div>
    <div class="col-md-2"><label class="form-label fw-semibold" for="max">Out of</label><input id="max" type="number" min="1" value="50" class="form-control"></div>
    <div class="col-md-3"><button class="btn btn-brand w-100" id="save"><i class="bi bi-check2 me-1"></i>Save marks</button></div></div></div>
  <div class="row g-3 mb-3" id="sum"></div>
  <div class="panel"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Student</th><th style="width:140px">Marks</th><th>Percentage</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</main></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="toast" class="toast text-bg-success" role="status"><div class="toast-body" id="toastMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script><script src="../assets/staff.js"></script>
<script src="../assets/js/staff/marks.js"></script></body></html>
