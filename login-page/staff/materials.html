<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="../assets/admin.css" rel="stylesheet">
  <link href="../assets/superadmin.css" rel="stylesheet"><title>Study materials | Staff</title></head>
<body><aside class="sidebar" id="sidebar"></aside><div class="backdrop" id="backdrop"></div>
<div class="main"><header class="topbar" id="topbar"></header><main class="content">
  <div class="mb-3"><h2 class="h4 fw-bold mb-0">Study materials</h2><div class="text-secondary small">Share notes, videos and practice files with your batches.</div></div>
  <div class="row g-3"><div class="col-xl-4"><form class="panel" id="form" novalidate><h2>Upload material</h2>
    <div class="mb-3"><label class="form-label fw-semibold" for="title">Title</label><input id="title" class="form-control" required><div class="invalid-feedback">Enter a title.</div></div>
    <div class="mb-3"><label class="form-label fw-semibold" for="type">Type</label><select id="type" class="form-select"><option>Notes</option><option>Video</option><option>Practice</option></select></div>
    <div class="mb-3"><label class="form-label fw-semibold" for="batch">Share with</label><select id="batch" class="form-select"></select></div>
    <div class="mb-3"><label class="form-label fw-semibold" for="file">File</label><input id="file" type="file" class="form-control" required><div class="invalid-feedback">Choose a file.</div></div>
    <button class="btn btn-brand w-100">Upload</button></form></div>
  <div class="col-xl-8"><div class="panel"><h2>Shared by you</h2><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Title</th><th>Type</th><th>Batch</th><th>Date</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div id="empty" class="text-center text-secondary py-4 d-none">Nothing shared yet. Upload your first file on the left.</div></div></div></div>
</main></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="toast" class="toast text-bg-success" role="status"><div class="toast-body" id="toastMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script><script src="../assets/staff.js"></script>
<script src="../assets/js/staff/materials.js"></script></body></html>
