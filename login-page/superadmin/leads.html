<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="../assets/admin.css" rel="stylesheet">
  <link href="../assets/superadmin.css" rel="stylesheet"><title>Leads & Admissions | Super Admin</title></head>
<body>
<aside class="sidebar" id="sidebar"></aside><div class="backdrop" id="backdrop"></div>
<div class="main"><header class="topbar" id="topbar"></header>
<main class="content">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div><h2 class="h4 fw-bold mb-0">Leads and admissions</h2><div class="text-secondary small">Track every enquiry from first call to enrollment.</div></div>
    <button class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#leadModal"><i class="bi bi-plus-lg me-1"></i>Add lead</button>
  </div>
  <div class="row g-2 mb-3" id="pipeline"></div>
  <div class="panel mb-3"><div class="row g-2">
    <div class="col-md-6"><div class="input-group"><span class="input-group-text bg-white"><i class="bi bi-search"></i></span><input id="q" class="form-control" placeholder="Search by name or phone" aria-label="Search leads"></div></div>
    <div class="col-6 col-md-3"><select id="fSource" class="form-select" aria-label="Filter by source"><option value="">All sources</option></select></div>
    <div class="col-6 col-md-3"><select id="fFollow" class="form-select" aria-label="Filter by follow-up"><option value="">All follow-ups</option><option value="today">Due today</option><option value="overdue">Overdue</option></select></div>
  </div></div>
  <div class="panel"><div class="table-responsive"><table class="table align-middle table-hover">
    <thead><tr><th>Lead</th><th>Interested in</th><th>Source</th><th>Counselor</th><th>Follow-up</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    <div id="empty" class="text-center text-secondary py-4 d-none">No leads match these filters. Clear a filter or add a lead.</div></div>
</main></div>

<div class="modal fade" id="leadModal" tabindex="-1" aria-labelledby="lT" aria-hidden="true"><div class="modal-dialog"><form class="modal-content" id="leadForm" novalidate>
  <div class="modal-header"><h2 class="modal-title h5 fw-bold" id="lT">Add lead</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body row g-3">
    <div class="col-6"><label class="form-label fw-semibold" for="lName">Name</label><input id="lName" class="form-control" required><div class="invalid-feedback">Enter the name.</div></div>
    <div class="col-6"><label class="form-label fw-semibold" for="lPhone">Phone</label><input id="lPhone" class="form-control" pattern="[0-9]{10}" inputmode="numeric" required><div class="invalid-feedback">Enter a 10-digit phone number.</div></div>
    <div class="col-6"><label class="form-label fw-semibold" for="lCourse">Interested in</label><select id="lCourse" class="form-select"></select></div>
    <div class="col-6"><label class="form-label fw-semibold" for="lSource">Source</label><select id="lSource" class="form-select"></select></div>
    <div class="col-6"><label class="form-label fw-semibold" for="lCoun">Counselor</label><select id="lCoun" class="form-select"></select></div>
    <div class="col-6"><label class="form-label fw-semibold" for="lFollow">Follow-up date</label><input id="lFollow" type="date" class="form-control" required><div class="invalid-feedback">Select a follow-up date.</div></div>
    <div class="col-12"><label class="form-label fw-semibold" for="lNote">Notes</label><textarea id="lNote" rows="2" class="form-control"></textarea></div>
  </div>
  <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-brand">Save lead</button></div></form></div></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="toast" class="toast text-bg-success" role="status"><div class="toast-body" id="toastMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script><script src="../assets/admin.js"></script>
<script src="../assets/js/superadmin/leads.js"></script></body></html>
