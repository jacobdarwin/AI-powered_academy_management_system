<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="../assets/admin.css" rel="stylesheet">
  <link href="../assets/superadmin.css" rel="stylesheet"><title>Trainers & Staff | Super Admin</title></head>
<body>
<aside class="sidebar" id="sidebar"></aside><div class="backdrop" id="backdrop"></div>
<div class="main"><header class="topbar" id="topbar"></header>
<main class="content">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div><h2 class="h4 fw-bold mb-0">Trainers and staff</h2><div class="text-secondary small" id="count"></div></div>
    <button class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#staffModal"><i class="bi bi-plus-lg me-1"></i>Add staff</button>
  </div>
  <ul class="nav nav-pills mb-3" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tDir" type="button" role="tab">Staff directory</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tLoad" type="button" role="tab">Trainer workload</button></li>
  </ul>
  <div class="tab-content">
    <div class="tab-pane fade show active" id="tDir"><div class="panel">
      <div class="row g-2 mb-3"><div class="col-md-6"><div class="input-group"><span class="input-group-text bg-white"><i class="bi bi-search"></i></span><input id="q" class="form-control" placeholder="Search by name or phone" aria-label="Search staff"></div></div>
      <div class="col-md-3"><select id="fRole" class="form-select" aria-label="Filter by role"><option value="">All roles</option></select></div></div>
      <div class="table-responsive"><table class="table align-middle table-hover"><thead><tr><th>Name</th><th>Role</th><th>Phone</th><th>Joined</th><th>Salary</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
      <div id="empty" class="text-center text-secondary py-4 d-none">No staff match. Clear the search or add a staff member.</div></div></div>
    <div class="tab-pane fade" id="tLoad"><div class="row g-3" id="loadCards"></div></div>
  </div>
</main></div>

<div class="modal fade" id="staffModal" tabindex="-1" aria-labelledby="sT" aria-hidden="true"><div class="modal-dialog"><form class="modal-content" id="staffForm" novalidate>
  <div class="modal-header"><h2 class="modal-title h5 fw-bold" id="sT">Add staff</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body row g-3">
    <div class="col-6"><label class="form-label fw-semibold" for="sName">Full name</label><input id="sName" class="form-control" required><div class="invalid-feedback">Enter the name.</div></div>
    <div class="col-6"><label class="form-label fw-semibold" for="sPhone">Phone</label><input id="sPhone" class="form-control" pattern="[0-9]{10}" inputmode="numeric" required><div class="invalid-feedback">Enter a 10-digit phone number.</div></div>
    <div class="col-6"><label class="form-label fw-semibold" for="sRole">Role</label><select id="sRole" class="form-select"></select></div>
    <div class="col-6"><label class="form-label fw-semibold" for="sJoin">Joining date</label><input id="sJoin" type="date" class="form-control" required><div class="invalid-feedback">Select the joining date.</div></div>
    <div class="col-6"><label class="form-label fw-semibold" for="sSal">Monthly salary (â‚¹)</label><input id="sSal" type="number" min="0" class="form-control" required><div class="invalid-feedback">Enter the salary.</div></div>
    <div class="col-6"><label class="form-label fw-semibold" for="sSkill">Skills (trainers)</label><input id="sSkill" class="form-control" placeholder="Python, Django"></div>
  </div>
  <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-brand">Save staff</button></div></form></div></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="toast" class="toast text-bg-success" role="status"><div class="toast-body" id="toastMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script><script src="../assets/admin.js"></script>
<script src="../assets/js/superadmin/staff.js"></script></body></html>
