<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="../assets/admin.css" rel="stylesheet">
  <link href="../assets/superadmin.css" rel="stylesheet"><title>Placement applications | Super Admin</title></head>
<body data-role="superadmin"><aside class="sidebar" id="sidebar"></aside><div class="backdrop" id="backdrop"></div>
<div class="main"><header class="topbar" id="topbar"></header><main class="content">
  <div class="mb-3"><h2 class="h4 fw-bold mb-0">Placement applications</h2><div class="text-secondary small">Review who applied to each drive and move them through the stages.</div></div>
  <div class="row g-2 mb-3" id="pipe"></div>
  <div class="panel mb-3"><div class="row g-2">
    <div class="col-md-5"><div class="input-group"><span class="input-group-text bg-white"><i class="bi bi-search"></i></span><input id="q" class="form-control" placeholder="Search by student name" aria-label="Search applications"></div></div>
    <div class="col-md-4"><select id="fCo" class="form-select" aria-label="Filter by company"><option value="">All companies</option></select></div>
    <div class="col-md-3"><button class="btn btn-outline-secondary w-100" id="exp"><i class="bi bi-download me-1"></i>Export shortlisted</button></div></div></div>
  <div class="panel"><div class="table-responsive"><table class="table align-middle table-hover"><thead><tr><th>Student</th><th>Company and role</th><th>Attendance</th><th>Applied</th><th>Resume</th><th>Stage</th></tr></thead><tbody id="rows"></tbody></table></div>
  <div id="empty" class="text-center text-secondary py-4 d-none">No applications match. Clear the search or the company filter.</div></div>
</main></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="toast" class="toast text-bg-success" role="status"><div class="toast-body" id="toastMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script><script src="../assets/admin.js"></script>
<script src="../assets/js/applications.js"></script></body></html>
