<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="../assets/admin.css" rel="stylesheet">
  <link href="../assets/superadmin.css" rel="stylesheet"><title>Placements | Super Admin</title></head>
<body>
<aside class="sidebar" id="sidebar"></aside><div class="backdrop" id="backdrop"></div>
<div class="main"><header class="topbar" id="topbar"></header>
<main class="content">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div><h2 class="h4 fw-bold mb-0">Placements</h2><div class="text-secondary small">Drives, hiring companies and placed students.</div></div>
    <button class="btn btn-brand" data-bs-toggle="modal" data-bs-target="#driveModal"><i class="bi bi-plus-lg me-1"></i>Schedule drive</button>
  </div>
  <div class="row g-3 mb-3" id="stats"></div>
  <ul class="nav nav-pills mb-3" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tDrives" type="button" role="tab">Drives</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tPlaced" type="button" role="tab">Placed students</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tCos" type="button" role="tab">Companies</button></li>
  </ul>
  <div class="tab-content"><div class="panel">
    <div class="tab-pane fade show active" id="tDrives"><div class="table-responsive"><table class="table align-middle table-hover"><thead><tr><th>Company</th><th>Role</th><th>Date</th><th>Package</th><th>Eligibility</th><th>Applied</th><th>Status</th></tr></thead><tbody id="driveRows"></tbody></table></div></div>
    <div class="tab-pane fade" id="tPlaced"><div class="table-responsive"><table class="table align-middle table-hover"><thead><tr><th>Student</th><th>Course</th><th>Company</th><th>Role</th><th>Package</th></tr></thead><tbody id="placedRows"></tbody></table></div></div>
    <div class="tab-pane fade" id="tCos"><div class="table-responsive"><table class="table align-middle table-hover"><thead><tr><th>Company</th><th>HR contact</th><th>Phone</th><th>Drives held</th><th>Students hired</th></tr></thead><tbody id="coRows"></tbody></table></div></div>
  </div></div>
</main></div>

<div class="modal fade" id="driveModal" tabindex="-1" aria-labelledby="dT" aria-hidden="true"><div class="modal-dialog"><form class="modal-content" id="driveForm" novalidate>
  <div class="modal-header"><h2 class="modal-title h5 fw-bold" id="dT">Schedule drive</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body row g-3">
    <div class="col-6"><label class="form-label fw-semibold" for="dCo">Company</label><input id="dCo" list="coList" class="form-control" required><datalist id="coList"></datalist><div class="invalid-feedback">Enter the company.</div></div>
    <div class="col-6"><label class="form-label fw-semibold" for="dRole">Role</label><input id="dRole" class="form-control" required><div class="invalid-feedback">Enter the role.</div></div>
    <div class="col-6"><label class="form-label fw-semibold" for="dDate">Drive date</label><input id="dDate" type="date" class="form-control" required><div class="invalid-feedback">Select the date.</div></div>
    <div class="col-6"><label class="form-label fw-semibold" for="dPkg">Package (LPA)</label><input id="dPkg" type="number" step="0.1" min="0" class="form-control" required><div class="invalid-feedback">Enter the package.</div></div>
    <div class="col-6"><label class="form-label fw-semibold" for="dCourse">Eligible course</label><select id="dCourse" class="form-select"><option>All courses</option><option>Python Full Stack</option><option>Data Science & AI</option><option>Java Full Stack</option><option>Digital Marketing</option></select></div>
    <div class="col-6"><label class="form-label fw-semibold" for="dAtt">Minimum attendance (%)</label><input id="dAtt" type="number" min="0" max="100" value="75" class="form-control"></div>
  </div>
  <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-brand">Schedule drive</button></div></form></div></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="toast" class="toast text-bg-success" role="status"><div class="toast-body" id="toastMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script><script src="../assets/admin.js"></script>
<script src="../assets/js/superadmin/placements.js"></script></body></html>
