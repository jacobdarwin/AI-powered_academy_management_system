<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link href="../assets/admin.css" rel="stylesheet">
  <link href="../assets/superadmin.css" rel="stylesheet"><title>Reports | Super Admin</title></head>
<body>
<aside class="sidebar" id="sidebar"></aside><div class="backdrop" id="backdrop"></div>
<div class="main"><header class="topbar" id="topbar"></header>
<main class="content">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div><h2 class="h4 fw-bold mb-0">Reports</h2><div class="text-secondary small">How the academy is doing, in numbers.</div></div>
    <div class="d-flex gap-2 no-print"><select id="range" class="form-select" aria-label="Report period"><option value="6">Last 6 months</option><option value="3">Last 3 months</option></select>
    <button class="btn btn-brand text-nowrap" onclick="window.print()"><i class="bi bi-printer me-1"></i>Print report</button></div>
  </div>
  <div class="row g-3 mb-3" id="stats"></div>
  <div class="row g-3 mb-3">
    <div class="col-xl-6"><div class="panel h-100"><h2>Revenue and expenses (â‚¹ lakh)</h2><div class="chart-box"><canvas id="c1"></canvas></div></div></div>
    <div class="col-xl-6"><div class="panel h-100"><h2>Admissions by course</h2><div class="chart-box"><canvas id="c2"></canvas></div></div></div>
  </div>
  <div class="row g-3">
    <div class="col-xl-6"><div class="panel h-100"><h2>Average attendance by batch (%)</h2><div class="chart-box"><canvas id="c3"></canvas></div></div></div>
    <div class="col-xl-6"><div class="panel h-100"><h2>Lead conversion by source</h2><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Source</th><th>Leads</th><th>Enrolled</th><th>Conversion</th></tr></thead><tbody id="conv"></tbody></table></div></div></div>
  </div>
</main></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="toast" class="toast text-bg-success" role="status"><div class="toast-body" id="toastMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/api.js"></script><script src="../assets/admin.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="../assets/js/superadmin/reports.js"></script></body></html>
